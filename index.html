<!DOCTYPE html>
<html>
<head>
  <title>Srinidhi's First Website</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { 
      font-family: Arial; 
      background-color: #ffe6f2; 
      text-align: center; 
      padding: 15px;
      margin: 0;
    }
    .qualities {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin: 15px auto;
      max-width: 90%;
    }
    button {
      background: #ff66a3;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px;
    }
    img {
      width: 85%;
      max-width: 280px;
      height: auto;
      border-radius: 10px;
      margin: 15px 0;
    }
  </style>
</head>
<body>
  <h1>Srinidhi's First Website</h1>
  <p>Hi! I am Srinidhi. I study in 5th class</p>
  
  <br><br>
<img src="https://i.postimg.cc/P5mHMcXQ/IMG-20260603-WA0013.jpg" alt="Sanvika Photo" width="300" style="border-radius: 10px;">

  <div class="qualities">
    <h2>Best qualities of my sister Srinidhi</h2>
    <p>She is kind, creative, and always ready to learn new things.</p>
 
    
    <p>She is NOT like me - she has her own special talents!</p>
<br><br>
    <button id="surpriseBtn">Click for a surprise</button>
    <div id="surpriseBox"></div>                                           
<script>
        let btn = document.getElementById("surpriseBtn");
        let box = document.getElementById("surpriseBox");

        btn.onclick = function() {
            box.innerHTML = "<h2 style='color:#ff1493; text-align:center;'>Srinidhi is the BEST!</h2><p style='text-align:center;'>Best sister ever!</p>";
            btn.style.backgroundColor = "hotpink";
            btn.innerText = "Love you Sister!";
        }
</script>

</body>
</html>
